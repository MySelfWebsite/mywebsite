<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎来到我的网站</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>创意设计工作室</h1>
            <p>为您的业务提供专业解决方案</p>
        </div>
    </header>

    <nav>
        <div class="container">
            <ul>
                <li><a href="#" class="active">首页</a></li>
                <li><a href="#">服务</a></li>
                <li><a href="#">案例</a></li>
                <li><a href="#">关于我们</a></li>
                <li><a href="#">联系方式</a></li>
            </ul>
        </div>
    </nav>

    <section class="hero">
        <div class="container">
            <h2>创新的数字解决方案</h2>
            <p>我们帮助企业在数字时代脱颖而出</p>
            <button id="ctaButton">获取方案</button>
        </div>
    </section>

    <section class="features">
        <div class="container">
            <div class="feature">
                <h3>网页设计</h3>
                <p>响应式设计，适配所有设备</p>
            </div>
            <div class="feature">
                <h3>品牌策略</h3>
                <p>打造独特的品牌形象</p>
            </div>
            <div class="feature">
                <h3>数字营销</h3>
                <p>提升您的在线影响力</p>
            </div>
        </div>
    </section>

    <section class="contact">
        <div class="container">
            <h2>联系我们</h2>
            <form id="contactForm">
                <input type="text" placeholder="您的姓名" required>
                <input type="email" placeholder="电子邮箱" required>
                <textarea placeholder="您的需求..." required></textarea>
                <button type="submit">提交</button>
            </form>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2023 创意设计工作室. 保留所有权利</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
